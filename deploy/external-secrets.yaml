# Per-agent API keys (TECH-STACK.md §9), custodied in OpenBao and synced via
# the estate ClusterSecretStore. The service does not read them yet; the auth
# work wires the resulting `loopcloser-api-keys` secret into the Deployment.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: loopcloser-api-keys
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: loopcloser-api-keys
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: loop-closer/api-keys
