# Per-agent API keys (TECH-STACK.md §9), self-issued by loopcloser and
# custodied in OpenBao at kv/loopcloser/api, synced via the estate `openbao`
# ClusterSecretStore. Each property at that path is one agent principal's key;
# `extract` copies every property under its own name into the
# `loopcloser-api-keys` Secret, which the Deployment mounts at API_KEYS_DIR
# (src/config.ts) so loadApiKeys reads one file per principal.
# Checked by deploy/tests/external-secret.test.ts.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: loopcloser-api-keys
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: loopcloser-api-keys
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: kv/loopcloser/api
---
# Registry pull credential (policy registry-credential-per-product v2:
# per_product_credential, decided 2026-11-16 on LC-D1b). loop-closer's own
# pull-only credential for the estate registry aks-obs-01 pulls from, custodied
# in OpenBao under the loop-closer product path at kv/loopcloser/registry-pull
# (properties `registry`, `username`, `password`), synced via the estate
# `openbao` ClusterSecretStore into the dockerconfigjson Secret
# `loopcloser-registry-pull` that every loopcloser Pod template lists in
# imagePullSecrets. Never a shared or another product's credential, and no
# literal value here: the template only references the OpenBao properties.
# Checked by deploy/tests/external-secret.test.ts.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: loopcloser-registry-pull
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: loopcloser-registry-pull
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{{ dict "auths" (dict .registry (dict "username" .username "password" .password "auth" (printf "%s:%s" .username .password | b64enc))) | toJson }}'
  data:
    - secretKey: registry
      remoteRef:
        key: kv/loopcloser/registry-pull
        property: registry
    - secretKey: username
      remoteRef:
        key: kv/loopcloser/registry-pull
        property: username
    - secretKey: password
      remoteRef:
        key: kv/loopcloser/registry-pull
        property: password
