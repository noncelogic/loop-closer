# The loopcloser REST API. Env is the config contract in src/config.ts.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loopcloser
  labels:
    app.kubernetes.io/name: loopcloser
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: loopcloser
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loopcloser
        app.kubernetes.io/component: api
    spec:
      automountServiceAccountToken: false
      # loop-closer's own pull-only credential (registry-credential-per-product v2),
      # synced from OpenBao by deploy/base/external-secrets.yaml.
      imagePullSecrets:
        - name: loopcloser-registry-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/noncelogic/loop-closer
          command: ["node", "dist/main.js"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: loopcloser-db-app
                  key: uri
          volumeMounts:
            # Per-agent API keys (src/config.ts API_KEYS_DIR); every /v1 call needs one.
            - name: api-keys
              mountPath: /etc/loopcloser/api-keys
              readOnly: true
            - name: api-scopes
              mountPath: /etc/loopcloser/api-scopes
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: api-keys
          secret:
            secretName: loopcloser-api-keys
        - name: api-scopes
          configMap:
            name: loopcloser-api-scopes
