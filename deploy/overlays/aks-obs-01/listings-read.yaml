# The listings-read sensor (LC-EST-PORTAL-CRON): the scheduled public read of
# the tracked directory listings (SPEC.md, directory-listing loops), because
# no listings API exists. It runs the portal-read entrypoint
# (`node dist/portal-read.js`, the image build's output of src/portal-read.ts).
#
# Its target URLs come from the graph, never from this manifest
# (LC-SENSE-LISTING-BINDINGS): the source_binding of each armed event When in
# an open directory-listing loop. A listing is tracked through intake
# (propose_loop, then accept_loop, with its public page URL as the binding), so
# no deploy change carries a listing URL and no listing-URL ConfigMap is
# mounted. With no binding a run reads nothing outside and only heartbeats.
# The CronJob ships SUSPENDED (the overlay's pinned image also predates
# src/portal-read.ts). Activation is CLOSER-215; the image rollout is CLOSER-216.
#
# The public read needs no credential (CLOSER-122): nothing is mounted, no
# ServiceAccount token is automounted, and the only Secret referenced is the
# graph's DATABASE_URL (the CNPG app URI), as for the tick. The image is set by
# the overlay's `images` pin.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: loopcloser-listings-read
  labels:
    app.kubernetes.io/name: loopcloser
    app.kubernetes.io/component: listings-read
  annotations:
    # After the schema Job (wave 2): a run reads and writes the migrated graph.
    argocd.argoproj.io/sync-wave: "3"
spec:
  # Every six hours: the anthropic_listings sensor's heartbeat interval
  # (src/sensors/sources.ts, ANTHROPIC_LISTINGS_SENSOR).
  schedule: "0 */6 * * *"
  suspend: true
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: loopcloser
            app.kubernetes.io/component: listings-read
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          # loop-closer's own pull-only credential (registry-credential-per-product v2),
          # synced from OpenBao by deploy/base/external-secrets.yaml.
          imagePullSecrets:
            - name: loopcloser-registry-pull
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: portal-read
              image: ghcr.io/noncelogic/loop-closer
              command: ["node", "dist/portal-read.js"]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: loopcloser-db-app
                      key: uri
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
