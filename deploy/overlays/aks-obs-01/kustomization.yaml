# What the estate's Argo CD syncs to aks-obs-01 (LC-EST-OVERLAY): the base
# package, every loopcloser container pinned to one estate-registry
# loopcloser:sha-<commit> image, and the schema Job that applies
# db/migrations before the API serves. Argo CD sync order, by
# argocd.argoproj.io/sync-wave:
#   0  Namespace, ExternalSecrets (API keys, registry pull), Service
#   1  CNPG Cluster loopcloser-db (publishes loopcloser-db-app/uri)
#   2  Job loopcloser-schema: Sync hook, `node dist/migrate.js`
#   3  Deployment loopcloser (the API); CronJobs loopcloser-tick and
#      loopcloser-listings-read
# The tick CronJob, shipped suspended in deploy/base/tick-cronjob.yaml, runs
# here (LC-EST-TICK): unsuspended, every minute, on the pinned image below, so
# armed Whens fire on the estate. It syncs after the schema Job so its first
# run claims due Whens from a migrated database.
# The listings-read CronJob (listings-read.yaml, LC-EST-PORTAL-CRON) ships
# suspended here, with no credential and no listing URL: its targets are the
# listing bindings in the graph (LC-SENSE-LISTING-BINDINGS), so it mounts no
# listing-URL ConfigMap.
# Checked by tests/deploy/overlay.test.ts, tests/deploy/aks-obs-01-overlay.test.ts,
# deploy/test/aks-obs-01-overlay.test.ts (LC-EST-SYNC: schema Job before every workload)
# and test/deploy/aks-obs-01-listings-read.test.ts.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: loop-closer

labels:
  - pairs:
      app.kubernetes.io/part-of: loopcloser
      app.kubernetes.io/managed-by: kustomize

resources:
  - ../../base
  - schema-job.yaml
  - listings-read.yaml

patches:
  - target:
      group: postgresql.cnpg.io
      version: v1
      kind: Cluster
      name: loopcloser-db
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "1"
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: loopcloser
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "3"
  - target:
      group: batch
      version: v1
      kind: CronJob
      name: loopcloser-tick
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "3"
      - op: replace
        path: /spec/suspend
        value: false

# One image for the API, the schema Job and both CronJobs: the
# `<ESTATE_REGISTRY>/loopcloser:sha-<full commit sha>` that
# .github/workflows/estate-image.yml publishes on merge to main
# (docs/ops/estate-image.md). The registry is the one the
# loopcloser-registry-pull credential covers (docs/ops/registry-pull.md):
# ESTATE_REGISTRY, noncelogicci.azurecr.io, never ghcr.io
# (LC-EST-PULL-REGISTRY, tests/deploy/estate-registry.test.ts).
# Until a publish run's push is verified pullable on aks-obs-01, this pins a
# sha-<commit> tag. Promotion (LC-EST-IMAGE-READY, docs/ops/estate-image.md)
# replaces newTag with `digest: <the sha256 the publish run pushed>` in the
# same change that adds image-evidence.json, the nonsecret record of that run
# and of the pull with kv/loopcloser/registry-pull, so the verified pull
# precedes Argo CD's sync. tests/deploy/aks-obs-01-overlay.test.ts gates it.
images:
  - name: ghcr.io/noncelogic/loop-closer
    newName: noncelogicci.azurecr.io/loopcloser
    newTag: sha-96f1e93b7a2b3811b65ae02ad2235415aa5f9c5a
