name: ci

# Plain `pull_request` only — never `pull_request_target` (docs/EXTERNAL-REVIEW.md §1).
# Runs on GitHub-hosted runners, not the estate's self-hosted ones.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KUBECTL_VERSION: v1.34.1
      KUSTOMIZE_VERSION: v5.7.1
      KUBECONFORM_VERSION: v0.8.0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      # tests/deploy/manifests.test.ts runs here too; same pinned tools as `manifests`.
      - name: Install pinned kubectl, kustomize and kubeconform
        run: bash .github/scripts/install-k8s-tools.sh
      - run: npm run typecheck
      - run: npm run build
      # Includes tests/foundation/local-replica.test.ts, which uses Docker Compose.
      - run: npm test

  # Renders every kustomize overlay and validates it with kubectl client-side
  # dry-run plus kubeconform schema validation against pinned Kubernetes and
  # CRD schemas (tests/deploy/manifests.test.ts). Installs its own pinned,
  # checksum-verified kubectl, kustomize and kubeconform instead of whatever
  # the runner image ships. Touches no cluster and reads no secret: no kubeconfig, no
  # cluster credentials, and the token stays read-only.
  manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KUBECTL_VERSION: v1.34.1
      KUSTOMIZE_VERSION: v5.7.1
      KUBECONFORM_VERSION: v0.8.0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install pinned kubectl, kustomize and kubeconform
        run: bash .github/scripts/install-k8s-tools.sh
      - run: node --test tests/deploy/manifests.test.ts

  # Builds the service image on every run; publishes to GHCR only on pushes to
  # main. Never touches a cluster: rollout of deploy/ is estate-side GitOps.
  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/noncelogic/loop-closer
          tags: |
            type=sha,format=long
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
