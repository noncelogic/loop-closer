name: ci

# Plain `pull_request` only — never `pull_request_target` (docs/EXTERNAL-REVIEW.md §1).
# Runs on GitHub-hosted runners, not the estate's self-hosted ones.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KUBECTL_VERSION: v1.34.1
      KUSTOMIZE_VERSION: v5.7.1
      KUBECONFORM_VERSION: v0.8.0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      # tests/deploy/manifests.test.ts and deploy/tests/external-secret.test.ts
      # run here too; same pinned tools as `manifests`.
      - name: Install pinned kubectl, kustomize and kubeconform
        run: bash .github/scripts/install-k8s-tools.sh
      - run: npm run typecheck
      - run: npm run build
      # Includes tests/foundation/local-replica.test.ts, which uses Docker Compose.
      - run: npm test

  # Renders every kustomize overlay and validates it with kubectl client-side
  # dry-run plus kubeconform schema validation against pinned Kubernetes and
  # CRD schemas checked in under tests/deploy/schemas/, read as local files only
  # (tests/deploy/manifests.test.ts). Installs its own pinned,
  # checksum-verified kubectl, kustomize and kubeconform instead of whatever
  # the runner image ships. Touches no cluster and reads no secret: no kubeconfig, no
  # cluster credentials, and the token stays read-only.
  manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KUBECTL_VERSION: v1.34.1
      KUSTOMIZE_VERSION: v5.7.1
      KUBECONFORM_VERSION: v0.8.0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install pinned kubectl, kustomize and kubeconform
        run: bash .github/scripts/install-k8s-tools.sh
      - run: node --test tests/deploy/manifests.test.ts deploy/tests/external-secret.test.ts

  # Builds the service image on every run; publishes to GHCR only on pushes to
  # main. Never touches a cluster: rollout of deploy/ is estate-side GitOps.
  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/noncelogic/loop-closer
          tags: |
            type=sha,format=long
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # The pull-request dry run of .github/workflows/estate-image.yml (policy
  # main-stays-green). The publish can only act on main; this job builds the same context and Dockerfile on a
  # GitHub-hosted runner, tags it like the publish without a registry, pushes
  # nothing, and runs the listings-read CronJob's command in the built image
  # (deploy/overlays/aks-obs-01/listings-read.yaml), so a merge cannot publish
  # an image that lacks the portal-read entrypoint. Reads no secret and no
  # estate configuration. Checked by test/deploy/estate-image.test.ts.
  estate-image-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: loopcloser:sha-${{ github.sha }}
      - name: Run the portal-read entrypoint in the built image
        run: bash .github/scripts/estate-image-smoke.sh loopcloser:sha-${{ github.sha }} node dist/portal-read.js

  # The pull-request dry run of the publish's registry inputs (policy
  # main-stays-green, LC-EST-IMAGE-PUBLISH). Runs the publish's own script in
  # `check` mode with the same inputs: ESTATE_REGISTRY and OPENBAO_ADDR are set,
  # the job's OIDC token logs in to OpenBao as role
  # loop-closer-registry-push-check, and the push credential at
  # kv/loop-closer/registry-push has a current version. Reads only that path's
  # metadata, never the credential, and no repository secret. Fails naming the
  # missing input. Checked by tests/ci/estate-image-workflow.test.ts.
  estate-image-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check the estate registry variable and OpenBao push credential are reachable
        env:
          ESTATE_REGISTRY: ${{ vars.ESTATE_REGISTRY }}
          OPENBAO_ADDR: ${{ vars.OPENBAO_ADDR }}
        run: node .github/scripts/estate-registry-credential.mjs check
