name: estate-image

# LC-D1b: on merge to main, build the loopcloser image and push it, tagged
# sha-<commit>, to the estate registry that aks-obs-01 pulls from. Never
# touches a cluster: rollout is estate-side GitOps, pinning a sha-<commit> tag.
#
# Trigger is `push` to main only: no pull_request, pull_request_target or
# workflow_run, so unmerged code never reaches the registry push credential
# (docs/EXTERNAL-REVIEW.md §1). The pull-request dry runs are ci.yml's
# `estate-image-dry-run` (build) and `estate-image-inputs` (registry inputs).
#
# Runner: GitHub-hosted, as ci.yml is (LC-ESTATE-IMAGE-RUNNER). The estate's
# passband-ci runners are registered only for noncelogic/loopmentum, so runs
# that asked for them never started.
#
# Registry login (LC-EST-IMAGE-PUBLISH): loop-closer's own least-privilege push
# credential, custodied in OpenBao at kv/loop-closer/registry-push (Rule:
# policies/placement-defaults.yaml#credentials), read through GitHub OIDC and
# OpenBao JWT auth by .github/scripts/estate-registry-credential.mjs. No
# repository secret is read. Repository variables:
#   ESTATE_REGISTRY   registry aks-obs-01 pulls from
#   OPENBAO_ADDR      estate OpenBao address
# ci.yml's `estate-image-inputs` job runs the same script in `check` mode on
# every pull request. tests/deploy/image-workflow.test.ts and
# tests/ci/estate-image-workflow.test.ts check this file.
on:
  push:
    branches: [main]

permissions:
  contents: read

# Group estate-image-hosted-v1, not the old `estate-image`: run 44147944903
# still holds that group, queued for the retired passband-ci label, and every
# hosted run waiting behind it was cancelled. Pushes stay serialised and a run
# in progress is never cancelled.
concurrency:
  group: estate-image-hosted-v1
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # id-token: write lets the job mint the OIDC token OpenBao's JWT auth
    # accepts for role loop-closer-registry-push (bound to main).
    permissions:
      contents: read
      id-token: write
    steps:
