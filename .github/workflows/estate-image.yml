name: estate-image

# LC-D1b: on merge to main, build the loopcloser image and push it, tagged
# sha-<commit>, to the estate registry that aks-obs-01 pulls from. Never
# touches a cluster: rollout is estate-side GitOps, pinning a sha-<commit> tag.
#
# Trigger is `push` to main only: no pull_request, pull_request_target or
# workflow_run, so unmerged code never reaches the registry push credential
# (docs/EXTERNAL-REVIEW.md §1). The pull-request dry run is ci.yml's
# `estate-image-dry-run` job.
#
# Runner: GitHub-hosted, as ci.yml is (LC-ESTATE-IMAGE-RUNNER). The estate's
# passband-ci runners are registered only for noncelogic/loopmentum, so runs
# that asked for them never started. The registry login comes from repository
# secrets; the registry host is a repository variable:
#   ESTATE_REGISTRY                  (variable) registry aks-obs-01 pulls from
#   ESTATE_REGISTRY_USERNAME         (secret)   registry push username
#   ESTATE_REGISTRY_PASSWORD         (secret)   registry push password/token
# tests/deploy/image-workflow.test.ts and tests/ci/estate-image-workflow.test.ts
# check this file.
on:
  push:
    branches: [main]

permissions:
  contents: read

# Group estate-image-hosted-v1, not the old `estate-image`: run 44147944903
# still holds that group, queued for the retired passband-ci label, and every
# hosted run waiting behind it was cancelled. Pushes stay serialised and a run
# in progress is never cancelled.
concurrency:
  group: estate-image-hosted-v1
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check estate registry configuration
        env:
          ESTATE_REGISTRY: ${{ vars.ESTATE_REGISTRY }}
          ESTATE_REGISTRY_USERNAME: ${{ secrets.ESTATE_REGISTRY_USERNAME }}
          ESTATE_REGISTRY_PASSWORD: ${{ secrets.ESTATE_REGISTRY_PASSWORD }}
        run: |
          missing=0
          if [ -z "$ESTATE_REGISTRY" ]; then
            echo "::error::repository variable ESTATE_REGISTRY is not set"
            missing=1
          fi
          for v in ESTATE_REGISTRY_USERNAME ESTATE_REGISTRY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::repository secret $v is not set"
              missing=1
            fi
          done
          exit "$missing"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.ESTATE_REGISTRY }}
          username: ${{ secrets.ESTATE_REGISTRY_USERNAME }}
          password: ${{ secrets.ESTATE_REGISTRY_PASSWORD }}
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ vars.ESTATE_REGISTRY }}/loopcloser:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      # The digest the registry returned for this push, with its source
      # commit and run, so the overlay can pin exactly this image by digest
      # once a pull of it on aks-obs-01 is verified (LC-EST-IMAGE-READY,
      # deploy/overlays/aks-obs-01/image-evidence.json). Nothing secret.
      - name: Record pushed digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE: ${{ vars.ESTATE_REGISTRY }}/loopcloser
        run: |
          case "$DIGEST" in
            sha256:*) ;;
            *) echo "::error::build-push returned no sha256 digest"; exit 1 ;;
          esac
          {
            echo "## Pushed loopcloser image"
            echo
            echo "- image: \`$IMAGE@$DIGEST\`"
            echo "- digest: \`$DIGEST\`"
            echo "- source commit: \`$GITHUB_SHA\`"
            echo "- run: \`$GITHUB_RUN_ID\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "pushed $IMAGE@$DIGEST from $GITHUB_SHA (run $GITHUB_RUN_ID)"
